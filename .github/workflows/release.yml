name: Release

# Push a tag like v0.2.0 (it must equal the version in Cargo.toml) to build and
# publish every package. Nothing is published until the publish-* jobs run, and
# those need the `pypi` / `npm` environments (with trusted publishing / an
# NPM_TOKEN secret) to be configured in the repository settings.
#
# DRY RUN: "Run workflow" (workflow_dispatch) builds everything, generates the SBOMs and signs every file, and keeps
# the results ONLY as workflow artifacts. The jobs that create a GitHub release or publish to PyPI or npm, and the
# artifact attestations, run only for a push of a v* tag (`github.event_name == 'push'`: a tag chosen in the
# "Run workflow" form is still a manual run). scripts/tests/test_release_workflow.py fails if a guard is removed.
# Signing is real, so even a dry run writes entries to the public Sigstore transparency log (Rekor).
#
# Every release file gets a CycloneDX SBOM (scripts/sbom.py), a Sigstore signature (cosign, keyless, GitHub OIDC)
# and, for a tag, GitHub build provenance and SBOM attestations. See docs/VERIFYING.md.
#
# NOT automated: Maven Central. It needs a verified Sonatype namespace and GPG
# signing. The Kotlin artifacts are built and attached to the GitHub release.

on:
  push:
    tags: ["v*"]
  workflow_dispatch: # dry run: see above


permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  check-version:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Tag matches the workspace version
        run: |
          version=$(grep -m1 '^version = ' Cargo.toml | cut -d'"' -f2)
          if [ "$GITHUB_EVENT_NAME" != "push" ]; then
            echo "dry run (workflow_dispatch) of $GITHUB_REF_NAME: version $version, nothing will be released"
            exit 0
          fi
          test "v$version" = "$GITHUB_REF_NAME" || { echo "tag $GITHUB_REF_NAME != workspace version v$version"; exit 1; }

  # Native library for every desktop platform (used by the Kotlin/JVM jar and attached to the release).
  natives:
    needs: check-version
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: ubuntu-22.04, target: x86_64-unknown-linux-gnu, jna: linux-x86-64, lib: libmsgkit_ffi.so }
          - { os: ubuntu-24.04-arm, target: aarch64-unknown-linux-gnu, jna: linux-aarch64, lib: libmsgkit_ffi.so }
          - { os: macos-latest, target: aarch64-apple-darwin, jna: darwin-aarch64, lib: libmsgkit_ffi.dylib }
          - { os: macos-latest, target: x86_64-apple-darwin, jna: darwin-x86-64, lib: libmsgkit_ffi.dylib }
          - { os: windows-latest, target: x86_64-pc-windows-msvc, jna: win32-x86-64, lib: msgkit_ffi.dll }
          - { os: windows-11-arm, target: aarch64-pc-windows-msvc, jna: win32-aarch64, lib: msgkit_ffi.dll }
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master
        with:
          toolchain: 1.99.0
          targets: ${{ matrix.target }}
      - run: cargo build -p msgkit-ffi --release --locked --target ${{ matrix.target }}
      - name: Stage library in JNA's resource layout
        shell: bash
        run: |
          mkdir -p "natives/${{ matrix.jna }}"
          cp "target/${{ matrix.target }}/release/${{ matrix.lib }}" "natives/${{ matrix.jna }}/"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: native-${{ matrix.jna }}
          path: natives

  python-wheels:
    needs: check-version
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: ubuntu-latest, target: x86_64-unknown-linux-gnu, plat: manylinux_2_28_x86_64, container: "quay.io/pypa/manylinux_2_28_x86_64" }
          - { os: ubuntu-24.04-arm, target: aarch64-unknown-linux-gnu, plat: manylinux_2_28_aarch64, container: "quay.io/pypa/manylinux_2_28_aarch64" }
          - { os: macos-latest, target: aarch64-apple-darwin, plat: macosx_11_0_arm64, container: "" }
          - { os: macos-latest, target: x86_64-apple-darwin, plat: macosx_10_12_x86_64, container: "" }
          - { os: windows-latest, target: x86_64-pc-windows-msvc, plat: win_amd64, container: "" }
          - { os: windows-11-arm, target: aarch64-pc-windows-msvc, plat: win_arm64, container: "" }
    runs-on: ${{ matrix.os }}
    container: ${{ matrix.container }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      # Linux wheels are built inside a manylinux container for broad glibc compatibility.
      - name: Rust (container)
        if: matrix.container != ''
        run: |
          curl -sSf https://sh.rustup.rs | sh -s -- -y --profile minimal
          echo "$HOME/.cargo/bin" >> "$GITHUB_PATH"
          echo "/opt/python/cp312-cp312/bin" >> "$GITHUB_PATH"
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master
        if: matrix.container == ''
        with:
          toolchain: 1.99.0
          targets: ${{ matrix.target }}
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        if: matrix.container == ''
        with:
          python-version: "3.12"
      - run: python -m pip install build
      - run: python packages/python/scripts/build_wheel.py --target ${{ matrix.target }} --out dist
        env:
          MSGKIT_WHEEL_PLAT: ${{ matrix.plat }}
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: wheel-${{ matrix.target }}
          path: dist/*.whl

  node:
    needs: check-version
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master
        with:
          toolchain: 1.99.0
          targets: wasm32-unknown-unknown
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
      - run: node packages/node/scripts/build.mjs
      - run: npm test
        working-directory: packages/node
      - run: npm pack
        working-directory: packages/node
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: npm-package
          path: packages/node/*.tgz

  kotlin:
    needs: natives
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master
        with:
          toolchain: 1.99.0
          targets: aarch64-linux-android,armv7-linux-androideabi,x86_64-linux-android,i686-linux-android
      - uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: temurin
          java-version: 21
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: native-*
          path: packages/kotlin/msgkit/natives
          merge-multiple: true
      - run: python3 packages/kotlin/scripts/build_android_libs.py
      - run: ./gradlew :msgkit:jar :msgkit:sourcesJar :msgkit-android:assembleRelease --console=plain
        working-directory: packages/kotlin
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: kotlin-artifacts
          path: |
            packages/kotlin/msgkit/build/libs/*.jar
            packages/kotlin/msgkit-android/build/outputs/aar/*-release.aar

  # CycloneDX software bills of materials for every released artifact (scripts/sbom.py).
  sbom:
    needs: check-version
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master
        with:
          toolchain: 1.99.0
      - uses: taiki-e/install-action@a4d3f3f761dcd95cce1b72cb61cb6d1963438177 # v2.87.30
        with:
          tool: cargo-cyclonedx@0.5.9
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
      - uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: temurin
          java-version: 21
      - uses: gradle/actions/setup-gradle@3f5f9adaf7d9fecd50b5935e54106014257a94e6 # v6.4.0
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - run: python -m pip install -r requirements-sbom.txt
      - name: Generate and validate the SBOMs
        run: |
          export SOURCE_DATE_EPOCH=$(git log -1 --format=%ct)
          python scripts/sbom.py --out sbom
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: sbom
          path: sbom/*.cdx.json

  # Checksums, Sigstore signatures (cosign, keyless: the GitHub OIDC identity of this workflow) and, for a pushed tag,
  # GitHub artifact attestations (SLSA build provenance and the SBOMs). The only job with these permissions; it
  # cannot write to the repository's contents.
  sign-and-attest:
    needs: [natives, python-wheels, node, kotlin, sbom]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write # the OIDC token Sigstore turns into a short-lived signing certificate
      attestations: write # store the attestations with the repository (tag pushes only)
      artifact-metadata: write # required by actions/attest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          path: artifacts
      - name: Stage the release files and their checksums
        id: stage
        run: |
          set -euo pipefail
          mkdir release
          find artifacts \( -name '*.whl' -o -name '*.tgz' -o -name '*.jar' -o -name '*.aar' -o -name '*.cdx.json' \) \
            -exec cp {} release/ \;
          (cd release && sha256sum -- * > ../SHA256SUMS)
          mv SHA256SUMS release/SHA256SUMS
          ls -l release
          echo "version=$(grep -m1 '^version = ' Cargo.toml | cut -d'"' -f2)" >> "$GITHUB_OUTPUT"
      - uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
        with:
          cosign-release: v3.1.3
      - name: Sign every file with Sigstore (keyless) and check each signature
        run: |
          set -euo pipefail
          identity="https://github.com/${GITHUB_REPOSITORY}/.github/workflows/release.yml@${GITHUB_REF}"
          for file in release/*; do
            cosign sign-blob --yes --bundle "${file}.sigstore.json" "${file}"
            cosign verify-blob --bundle "${file}.sigstore.json" \
              --certificate-identity "${identity}" \
              --certificate-oidc-issuer https://token.actions.githubusercontent.com "${file}"
          done
      # Attestations are stored with the repository and cannot be taken back, so they are made for a pushed tag only.
      - name: Build provenance (SLSA) for every release file
        if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-path: |
            release/*.whl
            release/*.tgz
            release/*.jar
            release/*.aar
            release/*.cdx.json
            release/SHA256SUMS
      - name: SBOM attestation of the npm package
        if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-path: release/*.tgz
          sbom-path: release/msgkit-node-${{ steps.stage.outputs.version }}.cdx.json
      - name: SBOM attestation of the Python wheels
        if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-path: release/*.whl
          sbom-path: release/msgkit-python-${{ steps.stage.outputs.version }}.cdx.json
      - name: SBOM attestation of the Kotlin JAR
        if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-path: release/*.jar
          sbom-path: release/msgkit-kotlin-${{ steps.stage.outputs.version }}.cdx.json
      - name: SBOM attestation of the Android AAR
        if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-path: release/*.aar
          sbom-path: release/msgkit-android-${{ steps.stage.outputs.version }}.cdx.json
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: signatures
          path: |
            release/*.sigstore.json
            release/SHA256SUMS

  github-release:
    needs: [natives, python-wheels, node, kotlin, sbom, sign-and-attest]
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          path: artifacts
      - uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3.0.3
        with:
          generate_release_notes: true
          files: |
            artifacts/**/*.whl
            artifacts/**/*.tgz
            artifacts/**/*.jar
            artifacts/**/*.aar
            artifacts/**/*.cdx.json
            artifacts/**/*.sigstore.json
            artifacts/**/SHA256SUMS

  publish-pypi:
    needs: github-release
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write # PyPI trusted publishing
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: wheel-*
          path: dist
          merge-multiple: true
      - uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33 # release/v1

  publish-npm:
    needs: github-release
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    environment: npm
    permissions:
      contents: read
      id-token: write # npm provenance
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: npm-package
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org
      - run: npm publish --provenance --access public ./*.tgz
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
