[package]
name = "msgkit-service"
description = "HTTP sidecar for msgkit: REST import endpoints and verified webhook receivers for any language."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
authors.workspace = true

[lints]
workspace = true

[[bin]]
name = "msgkit-service"
path = "src/main.rs"

[features]
# Encrypt the database file with SQLCipher (see msgkit-store-sqlite). Off by default.
sqlcipher = ["msgkit-store-sqlite/sqlcipher"]
sqlcipher-vendored = ["sqlcipher", "msgkit-store-sqlite/sqlcipher-vendored"]

[dependencies]
axum = "0.8.9"
getrandom = "0.4.3"
# The same exact pin as msgkit-core (a jiff bump is a behaviour change, see the tzdata policy); no time-zone data here.
jiff = { version = "=0.2.38", default-features = false, features = ["std"] }
msgkit-core.workspace = true
msgkit-store-sqlite.workspace = true
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
tokio = { version = "1.53.3", features = ["rt-multi-thread", "macros", "signal", "net"] }
tower-http = { version = "0.7.1", features = ["trace", "limit"] }
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }

[dev-dependencies]
hex = "0.4.3"
hmac = "0.13.0"
rusqlite = "0.40.2"
http-body-util = "0.1.5"
sha2 = "0.11.1"
tempfile = "3.27.0"
tower = { version = "0.5.3", features = ["util"] }
