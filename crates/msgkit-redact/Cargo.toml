[package]
name = "msgkit-redact"
description = "Optional, best-effort masking of phone numbers, Sri Lankan NIC numbers, card and bank account numbers and emails in text and msgkit events."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
authors.workspace = true
keywords = ["redaction", "privacy", "pii", "messaging"]
categories = ["text-processing"]

[lints]
workspace = true

[dependencies]
hex = "0.4.3"
hmac = "0.13.0"
msgkit-core.workspace = true
regex = "1.13.1"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
sha2 = "0.11.1"

[dev-dependencies]
proptest = { version = "1.12.0", default-features = false, features = ["std"] }
