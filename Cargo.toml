[workspace]
resolver = "2"
members = ["crates/*"]

[workspace.package]
version = "0.2.0"
edition = "2021"
rust-version = "1.88"
license = "MIT"
authors = ["Pamoda Jayathilaka and msgkit contributors"]
repository = "https://github.com/pamoda2004/msgkit"
homepage = "https://github.com/pamoda2004/msgkit"
readme = "README.md"
keywords = ["sms", "whatsapp", "messenger", "import", "messaging"]
categories = ["parser-implementations", "api-bindings"]

# Internal crates are declared once here (with a version, which crates.io requires to publish them).
# Bump these together with [workspace.package] version.
[workspace.dependencies]
msgkit-core = { path = "crates/msgkit-core", version = "0.2.0" }
msgkit-store-sqlite = { path = "crates/msgkit-store-sqlite", version = "0.2.0" }

[workspace.lints.rust]
unsafe_code = "forbid"
missing_debug_implementations = "warn"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }
# Error conditions are documented once, on the `Error` type and in docs/API.md, rather than
# repeated on every function; panics are not part of the contract (see the audit).
missing_errors_doc = "allow"
missing_panics_doc = "allow"

[profile.release]
lto = "thin"
codegen-units = 1
strip = true
