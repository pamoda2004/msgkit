name: CI

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: "17 4 * * 1" # weekly: advisories and new lints appear without any code change
  workflow_dispatch:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: -D warnings
  RUST_VERSION: "1.99.0" # keep in sync with rust-toolchain.toml
  # Minimum line coverage for msgkit-core. May only be raised.
  COVERAGE_MIN_LINES: "90"

# Actions are pinned to commit SHAs (the comment names the release); Dependabot keeps them current.
jobs:
  hygiene:
    name: Repository hygiene (no personal data)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - run: python scripts/check_repo_hygiene.py --tracked
      - run: python -m unittest discover -s scripts/tests -v

  generated-types:
    name: Generated types match the schema
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      # The TypeScript, Python and Kotlin data types are generated from schema/ (scripts/generate_types.py).
      - run: python scripts/generate_types.py --check

  rust-lint:
    name: Rust lint (fmt, clippy pedantic)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master
        with:
          toolchain: ${{ env.RUST_VERSION }}
          components: clippy, rustfmt
          targets: wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-targets --locked -- -D warnings
      # The wasm crate must also be clean for its real target.
      - run: cargo clippy -p msgkit-wasm --target wasm32-unknown-unknown --locked -- -D warnings

  rust-test:
    name: Rust tests (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master
        with:
          toolchain: ${{ env.RUST_VERSION }}
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
      - run: cargo test --workspace --locked
      # The committed JSON Schemas must match the Rust types.
      - run: cargo test -p msgkit-core --test schema --locked

  sqlcipher:
    name: SQLCipher (build, test, size)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master
        with:
          toolchain: ${{ env.RUST_VERSION }}
          components: clippy
      # No build cache on purpose: the build times below are cold-build times, comparable from run to run.
      # The system OpenSSL is linked (the `sqlcipher` feature); `sqlcipher-vendored` builds OpenSSL from source.
      - run: sudo apt-get update && sudo apt-get install -y libssl-dev pkg-config
      - name: Tests with SQLCipher
        env:
          FEATURES: msgkit-store-sqlite/sqlcipher,msgkit-service/sqlcipher,msgkit-cli/sqlcipher
        run: |
          cargo clippy -p msgkit-store-sqlite -p msgkit-service -p msgkit-cli --all-targets --locked --features "$FEATURES" -- -D warnings
          cargo test -p msgkit-store-sqlite -p msgkit-service -p msgkit-cli --locked --features "$FEATURES"
      - name: Build time and size, default versus SQLCipher
        env:
          FEATURES: msgkit-store-sqlite/sqlcipher,msgkit-service/sqlcipher,msgkit-cli/sqlcipher
        run: |
          start=$(date +%s)
          CARGO_TARGET_DIR=target-default cargo build --release --locked -p msgkit-service -p msgkit-cli
          default_secs=$(( $(date +%s) - start ))
          start=$(date +%s)
          CARGO_TARGET_DIR=target-sqlcipher cargo build --release --locked -p msgkit-service -p msgkit-cli --features "$FEATURES"
          cipher_secs=$(( $(date +%s) - start ))
          size() { stat -c %s "$1"; }
          {
            echo "### SQLCipher build impact (ubuntu-latest, cold build, release, system OpenSSL)"
            echo
            echo "| | default | SQLCipher |"
            echo "|---|---|---|"
            echo "| build time (service + CLI) | ${default_secs} s | ${cipher_secs} s |"
            echo "| msgkit-service | $(size target-default/release/msgkit-service) bytes | $(size target-sqlcipher/release/msgkit-service) bytes |"
            echo "| msgkit (CLI) | $(size target-default/release/msgkit) bytes | $(size target-sqlcipher/release/msgkit) bytes |"
            echo
            echo "Dynamic libraries linked by the SQLCipher service binary:"
            echo '```'
            ldd target-sqlcipher/release/msgkit-service | sed 's/(0x[0-9a-f]*)//' | awk '{print $1}'
            echo '```'
            echo "The default service binary links libssl or libcrypto: $(ldd target-default/release/msgkit-service | grep -c -E 'libssl|libcrypto')"
          } | tee -a "$GITHUB_STEP_SUMMARY"

  sbom:
    name: SBOM (generate and validate)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master
        with:
          toolchain: ${{ env.RUST_VERSION }}
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
      - uses: taiki-e/install-action@8cca0918f8471c33515202b73f56ab27f2bed283 # v2.87.29
        with:
          tool: cargo-cyclonedx@0.5.9
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
      - uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: temurin
          java-version: 21
      - uses: gradle/actions/setup-gradle@3f5f9adaf7d9fecd50b5935e54106014257a94e6 # v6.4.0
        with:
          cache-read-only: ${{ github.ref != 'refs/heads/main' }}
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - run: python -m pip install -r requirements-sbom.txt
      # The same script the release workflow runs: so the first release is not the first time it runs.
      # Nothing is signed or published here.
      - name: Generate and validate the SBOMs
        run: |
          export SOURCE_DATE_EPOCH=$(git log -1 --format=%ct)
          python scripts/sbom.py --out sbom
      - run: python -m unittest discover -s scripts/tests -v
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: sbom
          path: sbom/*.cdx.json
          retention-days: 7

  msrv:
    name: Rust MSRV (1.88)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master
        with:
          toolchain: "1.88"
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
      # rust-toolchain.toml pins the project toolchain; override it for this job only.
      - run: cargo +1.88 check --workspace --all-targets --locked

  coverage:
    name: Coverage (msgkit-core)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master
        with:
          toolchain: ${{ env.RUST_VERSION }}
          components: llvm-tools-preview
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
      - uses: taiki-e/install-action@8cca0918f8471c33515202b73f56ab27f2bed283 # v2.87.29
        with:
          tool: cargo-llvm-cov
      # tests/purity.rs inspects the dependency graph of the whole workspace with `cargo tree --offline`. This job builds
      # only msgkit-core, so without this step the other crates' dependencies were downloaded only when the cache
      # happened to hold them, and the test failed (a flake) whenever it did not.
      - name: Download every dependency of the workspace
        run: cargo fetch --locked
      - name: Measure
        run: |
          cargo llvm-cov -p msgkit-core --locked --no-report
          cargo llvm-cov report --lcov --output-path lcov.info
          cargo llvm-cov report --json --summary-only --output-path coverage.json
      - name: Show the least-covered files
        run: python3 scripts/coverage_gaps.py lcov.info
      - name: Enforce the minimum
        run: |
          pct=$(python3 -c "import json; print(round(json.load(open('coverage.json'))['data'][0]['totals']['lines']['percent'], 2))")
          echo "::notice title=msgkit-core line coverage::${pct}% (minimum ${COVERAGE_MIN_LINES}%)"
          python3 - "$pct" "$COVERAGE_MIN_LINES" <<'PY'
          import sys
          pct, minimum = float(sys.argv[1]), float(sys.argv[2])
          if pct < minimum:
              print(f"::error title=Coverage below minimum::msgkit-core line coverage {pct}% is below {minimum}%")
              sys.exit(1)
          PY
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: coverage
          path: |
            lcov.info
            coverage.json

  semver:
    name: API and schema compatibility
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0 # tags and history are the comparison baseline
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master
        with:
          toolchain: ${{ env.RUST_VERSION }}
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
      - uses: taiki-e/install-action@8cca0918f8471c33515202b73f56ab27f2bed283 # v2.87.29
        with:
          tool: cargo-semver-checks
      - name: Pick the baseline
        id: base
        run: |
          # Pull requests compare to their base; pushes to the previous commit; first runs to the baseline tag.
          base="${{ github.event.pull_request.base.sha || github.event.before }}"
          if [ -z "$base" ] || [ "$base" = "0000000000000000000000000000000000000000" ] || ! git cat-file -e "$base^{commit}" 2>/dev/null; then
            base="baseline-prototype"
          fi
          echo "ref=$base" >> "$GITHUB_OUTPUT"
          echo "Comparing against $base"
      - name: Rust public API (semver)
        # The released-API baseline is the tagged prototype until the first real release exists. A crate that is
        # newer than the baseline has nothing to compare with and is excluded; it joins when the baseline moves to
        # the first release (msgkit-redact: added in Phase 4).
        # BACKLOG: remove `--exclude msgkit-redact` as soon as msgkit-redact has a released baseline (docs/REDACTION.md).
        # The exclusion covers only that crate; msgkit-core, -ffi, -service, -store-sqlite and -wasm are still checked.
        run: cargo semver-checks --workspace --exclude msgkit-redact --baseline-rev baseline-prototype
      - name: JSON Schema compatibility
        run: python scripts/schema_compat.py --base-ref "${{ steps.base.outputs.ref }}"

  supply-chain:
    name: Advisories and licences
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - uses: taiki-e/install-action@8cca0918f8471c33515202b73f56ab27f2bed283 # v2.87.29
        with:
          tool: cargo-audit,cargo-deny
      - run: cargo audit
      - run: cargo deny check
      - run: npm audit --audit-level=moderate
        working-directory: packages/node
      - run: |
          python -m pip install pip-audit
          pip-audit -r requirements-dev.txt

  python-lint:
    name: Python lint (ruff, mypy)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - run: python -m pip install -r requirements-dev.txt
      - run: ruff check .
      - run: ruff format --check .
      - run: mypy

  python-test:
    name: Python ${{ matrix.python }} (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python: ["3.9", "3.10", "3.11", "3.12", "3.13"]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master
        with:
          toolchain: ${{ env.RUST_VERSION }}
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ matrix.python }}
      - run: cargo build -p msgkit-ffi --locked
      - run: python -m unittest discover -s packages/python/tests -v
        env:
          PYTHONPATH: packages/python/src
      # Build the wheel, install it into a clean venv and test *that* (one interpreter per OS is enough).
      - name: Wheel test
        if: matrix.python == '3.12'
        shell: bash
        run: |
          python -m pip install build
          status=0
          python packages/python/scripts/test_wheel.py > wheel-test.log 2>&1 || status=$?
          cat wheel-test.log
          if [ "$status" -ne 0 ]; then
            echo "::error title=Wheel test failed::$(tail -n 12 wheel-test.log | tr '[:space:]' ' ' | cut -c1-1500)"
          fi
          exit "$status"

  node:
    name: Node.js ${{ matrix.node }}
    strategy:
      fail-fast: false
      matrix:
        node: [20, 21, 22, 23, 24]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master
        with:
          toolchain: ${{ env.RUST_VERSION }}
          targets: wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ matrix.node }}
      - run: node packages/node/scripts/build.mjs
      - run: npm ci
        working-directory: packages/node
      - run: npm run lint
        working-directory: packages/node
      - run: npm run typecheck
        working-directory: packages/node
      - run: npm test
        working-directory: packages/node
      - run: npm pack --dry-run
        working-directory: packages/node
      # Package size, for the job summary (compare before and after dependency changes).
      - name: Package size
        if: matrix.node == 22
        shell: bash
        working-directory: packages/node
        run: |
          npm pack --dry-run --json > pack.json
          node -e "const p=require('./pack.json')[0]; const w=p.files.find(f=>f.path.endsWith('.wasm')); const line='npm package: tarball '+p.size+' bytes, wasm '+w.size+' bytes, unpacked '+p.unpackedSize+' bytes'; console.log('SIZE '+line); require('fs').appendFileSync(process.env.GITHUB_STEP_SUMMARY, line+String.fromCharCode(10))"

  kotlin-jvm:
    name: Kotlin JVM (JDK ${{ matrix.java }}, ${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: ubuntu-latest, java: 17 }
          - { os: ubuntu-latest, java: 21 }
          - { os: windows-latest, java: 21 }
          - { os: macos-latest, java: 21 }
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master
        with:
          toolchain: ${{ env.RUST_VERSION }}
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
      - uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: temurin
          java-version: ${{ matrix.java }}
      - uses: gradle/actions/setup-gradle@3f5f9adaf7d9fecd50b5935e54106014257a94e6 # v6.4.0
        with:
          cache-read-only: ${{ github.ref != 'refs/heads/main' }}
      - run: cargo build -p msgkit-ffi --release --locked
      - name: ktlint, detekt and tests
        run: ./gradlew :msgkit:ktlintCheck :msgkit:detekt :msgkit:test --console=plain
        working-directory: packages/kotlin
        shell: bash

  android:
    name: Android (build and emulator tests)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master
        with:
          toolchain: ${{ env.RUST_VERSION }}
          targets: aarch64-linux-android,armv7-linux-androideabi,x86_64-linux-android,i686-linux-android
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
      - uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: temurin
          java-version: 21
      - uses: gradle/actions/setup-gradle@3f5f9adaf7d9fecd50b5935e54106014257a94e6 # v6.4.0
        with:
          cache-read-only: ${{ github.ref != 'refs/heads/main' }}
      - name: Enable KVM for the emulator
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - run: python3 packages/kotlin/scripts/build_android_libs.py
      - run: ./gradlew :msgkit-android:ktlintCheck :msgkit-android:assembleRelease --console=plain
        working-directory: packages/kotlin
      - name: Library size
        shell: bash
        run: |
          for f in packages/kotlin/msgkit-android/build/outputs/aar/*-release.aar; do
            line="android aar: $(basename "$f") $(stat -c %s "$f") bytes"
            echo "SIZE $line"; echo "$line" >> "$GITHUB_STEP_SUMMARY"
          done
          for f in packages/kotlin/msgkit-android/src/main/jniLibs/*/libmsgkit_ffi.so; do
            line="android lib: $(basename "$(dirname "$f")") $(stat -c %s "$f") bytes"
            echo "SIZE $line"; echo "$line" >> "$GITHUB_STEP_SUMMARY"
          done
      - name: Instrumented tests on an emulator
        uses: reactivecircus/android-emulator-runner@a421e43855164a8197daf9d8d40fe71c6996bb0d # v2.38.0
        with:
          api-level: 34
          arch: x86_64
          script: sh scripts/ci_android_tests.sh

  # Short fuzz run of every parser and the webhook verifier (cargo-fuzz needs nightly and Linux). Seeds live in
  # fuzz/corpus and are also replayed on every platform by crates/msgkit-core/tests/fuzz_corpus.rs. When a run
  # finds a crash, the input is uploaded as an artifact; add it to the matching corpus directory as a regression.
  fuzz:
    name: Fuzz (60 s per target)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      # A dated nightly keeps results reproducible. RUSTUP_TOOLCHAIN also overrides rust-toolchain.toml, which
      # pins the stable release and would otherwise reject the sanitizer flags. Bump the date deliberately.
      FUZZ_NIGHTLY: nightly-2026-10-14
      RUSTUP_TOOLCHAIN: nightly-2026-10-14
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master
        with:
          toolchain: nightly-2026-10-14
      - uses: taiki-e/install-action@8cca0918f8471c33515202b73f56ab27f2bed283 # v2.87.29
        with:
          tool: cargo-fuzz
      - name: Fuzz every target
        run: |
          for target in $(cargo fuzz list); do
            echo "::group::fuzz $target"
            # The cargo-fuzz release binary is built for musl and would default to that target, which the
            # sanitizers do not support; build for the glibc host instead.
            cargo fuzz run --target x86_64-unknown-linux-gnu "$target" -- -max_total_time=60 -rss_limit_mb=2048 -timeout=10
            echo "::endgroup::"
          done
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: failure()
        with:
          name: fuzz-crashes
          path: fuzz/artifacts
          if-no-files-found: ignore

  # Weekly canary: does the newest stable Rust (new clippy lints) still pass? Never blocks a change.
  rust-latest-stable:
    name: Rust latest stable (canary)
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master
        with:
          toolchain: stable
          components: clippy
      - run: cargo +stable clippy --workspace --all-targets -- -D warnings
      - run: cargo +stable test --workspace
