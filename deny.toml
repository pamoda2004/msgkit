# cargo-deny policy: licences, advisories, duplicate versions and registries for the Rust workspace.
# Run with `cargo deny check` (CI does this on every change and on a weekly schedule).

[graph]
all-features = true

[advisories]
version = 2
yanked = "deny"
# Add an advisory id here only with a written reason and an expiry review date.
ignore = []

[licenses]
version = 2
confidence-threshold = 0.9
# Permissive licences only. A new dependency under any other licence fails CI until it is reviewed.
allow = [
  "MIT",
  "Apache-2.0",
  "Apache-2.0 WITH LLVM-exception",
  "BSD-3-Clause",
  "BSL-1.0",
  "Unicode-3.0",
  "Unlicense",
  "Zlib",
]

[bans]
multiple-versions = "warn"
wildcards = "deny"
highlight = "all"

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
