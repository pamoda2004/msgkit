[package]
name = "msgkit-cli"
description = "Command line interface for msgkit: convert message exports to normalized NDJSON."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true

[lints]
workspace = true

[[bin]]
name = "msgkit"
path = "src/main.rs"

[dependencies]
clap = { version = "4.5.61", features = ["derive"] }
msgkit-core = { path = "../msgkit-core" }
serde_json = "1.0.154"
