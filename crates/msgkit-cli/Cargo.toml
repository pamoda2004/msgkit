[package]
name = "msgkit-cli"
description = "Command line interface for msgkit: convert message exports to normalized NDJSON."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
authors.workspace = true

[lints]
workspace = true

[[bin]]
name = "msgkit"
path = "src/main.rs"

[features]
# Encrypt the database file with SQLCipher (see msgkit-store-sqlite). Off by default.
sqlcipher = ["msgkit-store-sqlite/sqlcipher"]
sqlcipher-vendored = ["sqlcipher", "msgkit-store-sqlite/sqlcipher-vendored"]

[dependencies]
clap = { version = "4.5.61", features = ["derive"] }
msgkit-core.workspace = true
msgkit-store-sqlite.workspace = true
serde_json = "1.0.154"

[dev-dependencies]
tempfile = "3.27.0"
