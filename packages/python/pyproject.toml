[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "msgkit"
version = "0.1.0"
description = "Import SMS, WhatsApp and Messenger messages and calls into one normalized model."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.9"
dependencies = []
keywords = ["sms", "whatsapp", "messenger", "facebook", "import", "chat-export", "webhook"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Developers",
  "Programming Language :: Python :: 3",
  "Programming Language :: Rust",
  "Topic :: Communications :: Chat",
  "Typing :: Typed",
]

[tool.setuptools]
package-dir = { "" = "src" }

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
msgkit = ["py.typed", "_lib/*"]
