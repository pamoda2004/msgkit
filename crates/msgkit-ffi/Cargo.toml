[package]
name = "msgkit-ffi"
description = "C ABI for msgkit: a single JSON-in/JSON-out entry point usable from any language."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
authors.workspace = true

# Unsafe code is unavoidable at an FFI boundary, so this crate does not inherit
# the workspace `unsafe_code = "forbid"` lint. It is kept as small as possible.

[lints.rust]
unsafe_code = "allow"
missing_debug_implementations = "warn"

[lints.clippy]
all = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }
missing_errors_doc = "allow"
missing_panics_doc = "allow"

[lib]
crate-type = ["cdylib", "staticlib", "rlib"]

[dependencies]
msgkit-core.workspace = true
serde_json = "1.0.154"
