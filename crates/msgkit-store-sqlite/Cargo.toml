[package]
name = "msgkit-store-sqlite"
description = "Durable SQLite implementation of msgkit's EventStore."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
authors.workspace = true

[lints]
workspace = true

[features]
# Encrypts the whole database file with SQLCipher (AES-256, also the write-ahead log). Off by default: the default
# build is plain SQLite and needs no OpenSSL. This links the system OpenSSL (libssl-dev on Linux); on Windows and
# macOS, or where there is none, use `sqlcipher-vendored` to build OpenSSL from source (needs Perl and a C compiler).
sqlcipher = ["rusqlite/bundled-sqlcipher"]
sqlcipher-vendored = ["sqlcipher", "rusqlite/bundled-sqlcipher-vendored-openssl"]

[dependencies]
msgkit-core.workspace = true
rusqlite = { version = "0.40.2", features = ["bundled"] }
serde_json = "1.0.154"

[dev-dependencies]
tempfile = "3.27.0"
