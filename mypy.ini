[mypy]
# mypy 2.x cannot target 3.9; the package itself still supports 3.9 (ruff target-version = py39 guards syntax).
python_version = 3.10
strict = True
warn_unreachable = True
files = packages/python/src, packages/python/tests, packages/python/scripts, scripts, examples/python, examples/consumers/python
mypy_path = packages/python/src:scripts
explicit_package_bases = True
namespace_packages = True

[mypy-packages.python.setup]
ignore_errors = True

# Optional tooling of scripts/sbom.py (requirements-sbom.txt): not installed in every environment.
[mypy-cyclonedx.*,packageurl.*]
ignore_missing_imports = True
